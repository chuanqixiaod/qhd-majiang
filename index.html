<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>秦皇岛麻将 · 民间版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a1411;color:#e8efe9;min-height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;transition:transform .12s,filter .15s}
button:active{transform:scale(.95)}
button:disabled{opacity:.4;cursor:not-allowed}
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow-y:auto;max-width:480px;margin:0 auto}
#lobby h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#e9c46a,#f4a261);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#lobby .sub{color:#8fb3a6;margin-bottom:32px;font-size:13px;text-align:center;padding:0 20px}
#lobby .panel{background:linear-gradient(160deg,#13291f,#0e2019);border:1px solid #2e5a48;border-radius:16px;padding:28px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#lobby .mode{display:flex;gap:10px;margin-bottom:20px}
#lobby .mode button{flex:1;padding:10px;background:#2e5a48;color:#fff;font-size:14px;font-weight:600}
#lobby .mode button.active{background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b}
#lobby input{width:100%;padding:12px;background:#0a1713;border:1px solid #2e5a48;border-radius:8px;color:#e8efe9;font-size:16px;margin-bottom:12px;text-align:center;letter-spacing:2px}
.lobby-btn{width:100%;padding:12px;background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(233,196,106,.25)}
.room-info{text-align:center;margin-top:14px;color:#8fb3a6;font-size:12px}
.room-info b{color:#e9c46a;font-size:22px}
.lobby-status{text-align:center;margin-top:14px;font-size:13px;color:#e9c46a;min-height:18px}
#lobby .hint{margin-top:20px;font-size:11px;color:#5a7d6f;text-align:center;line-height:1.6}
/* 横屏舞台：竖屏手机整体旋转90度，进入牌桌即横屏。容器本身不拦截点击，避免透明层盖住大厅按钮 */
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;pointer-events:none}
#table,#room-wait,#result-overlay{pointer-events:auto}
@media (orientation:portrait) and ((pointer:coarse) or (max-width:620px)){
 #stage{top:0;left:0;right:auto;bottom:auto;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
}
/* 呢绒台布：边缘暗角 + 顶部暖光 + 竖向绒线 + 横向织线 + 斜纹，多层叠加模拟布纹 */
#table{display:none;position:absolute;inset:0;overflow:hidden;background:
 radial-gradient(ellipse 120% 90% at 50% 50%,transparent 52%,rgba(0,0,0,.28) 82%,rgba(0,0,0,.5) 100%),
 radial-gradient(ellipse 70% 42% at 50% 12%,rgba(233,196,106,.07),transparent 70%),
 repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
 repeating-linear-gradient(45deg,rgba(255,255,255,.01) 0 2px,transparent 2px 5px),
 radial-gradient(ellipse at 50% 44%,#1c9a7b 0%,#127f65 40%,#0b614e 70%,#073f33 100%);box-shadow:inset 0 0 0 1.8vh #241710,inset 0 0 0 2.05vh rgba(201,162,79,.92),inset 0 0 8vh rgba(0,0,0,.55)}
/* 秦字暗纹（本地特色压花） */
#table::before{content:'秦';position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:'STKaiti','KaiTi','STSong',serif;font-weight:700;font-size:36vh;line-height:1;color:transparent;text-shadow:0 -.25vh .15vh rgba(255,255,255,.06),0 .3vh .35vh rgba(0,0,0,.22);pointer-events:none;z-index:0}
/* 金色缝线边框 */
#table::after{content:'';position:absolute;inset:4.6vh;border:1.5px dashed rgba(216,184,108,.35);border-radius:3.4vh;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.18);pointer-events:none;z-index:0}
.tile{display:inline-flex;align-items:center;justify-content:center;font-weight:700;user-select:none;border-radius:5px;position:relative;font-style:normal;font-family:'STKaiti','KaiTi','STSong','SimSun',serif;flex:0 0 auto}
.tile-face{background:linear-gradient(165deg,#fffef9 0%,#f8f1e3 48%,#ecdfc4 78%,#e2d2b2 100%);border:1px solid #b3a178;border-bottom-width:3px;border-radius:5px;box-shadow:0 2px 2px rgba(0,0,0,.35),0 4px 7px rgba(0,0,0,.3),inset 0 1px 0 #fff,inset 0 -4px 6px rgba(120,90,40,.18);color:#1c1c1c;overflow:hidden}
.tile-face::before{content:'';position:absolute;top:0;left:6%;right:6%;height:40%;border-radius:0 0 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.tile-face .tk-num{position:absolute;top:7%;left:0;right:0;text-align:center;font-size:.6em;color:#161616;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.65)}
.tile-face .tk-suit{position:absolute;bottom:3%;left:0;right:0;text-align:center;font-size:.66em;color:#c1121f;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.tile-face .tk-zi{font-size:.92em;line-height:1;color:#17304a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.tile-face.j-zhong .tk-zi{color:#d83030}
.tile-face.j-fa .tk-zi{color:#1e7d46}
.tile-face .bai-frame{width:60%;height:66%;border:2px solid #2f6f86;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(47,111,134,.35),0 1px 0 rgba(255,255,255,.7)}
/* 混儿牌：双层金边+呼吸金光，全场景醒目 */
.tile.wan-tile{border-color:#d99a18;box-shadow:0 0 0 2px #ffd24a,0 0 0 3.4px rgba(176,112,8,.95),0 0 12px rgba(255,200,80,.8),0 4px 7px rgba(0,0,0,.35),inset 0 0 6px rgba(255,210,90,.55);animation:wanGlow 1.5s ease-in-out infinite}
@keyframes wanGlow{0%,100%{box-shadow:0 0 0 2px #ffd24a,0 0 0 3.4px rgba(176,112,8,.95),0 0 9px rgba(255,200,80,.6),0 4px 7px rgba(0,0,0,.35),inset 0 0 5px rgba(255,210,90,.45)}50%{box-shadow:0 0 0 2px #ffe491,0 0 0 3.4px rgba(201,138,12,1),0 0 20px rgba(255,206,92,.98),0 4px 7px rgba(0,0,0,.35),inset 0 0 9px rgba(255,222,120,.8)}}
.hand-me .tile.sel.wan-tile{box-shadow:0 0 0 2px #ffd24a,0 0 0 3.4px rgba(176,112,8,.95),0 0 20px rgba(255,206,92,.98),0 6px 10px rgba(0,0,0,.4)}
/* 手牌混儿角标“混”字 */
.hand-me .tile.wan-tile::after{content:'混';position:absolute;top:-.55vh;left:-.5vh;z-index:3;background:linear-gradient(135deg,#ffe7a0,#e6a317);color:#5c3800;font-size:1.05vh;line-height:1.35;font-weight:800;border-radius:3px;padding:0 .35vh;box-shadow:0 1px 3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7)}
/* 混儿二次确认：红金急闪 */
.hand-me .tile.wan-arm{border-color:#ff3b20;animation:wanArm .45s ease-in-out infinite!important}
@keyframes wanArm{0%,100%{box-shadow:0 0 0 2px #ff8a66,0 0 0 4px rgba(214,40,40,.9),0 0 12px rgba(255,80,40,.8),0 4px 7px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 2.5px #ffd24a,0 0 0 4.5px rgba(255,59,32,1),0 0 24px rgba(255,60,20,1),0 4px 7px rgba(0,0,0,.35)}}
.dots{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:88%;height:88%}
.dots i{width:.46em;height:.46em;border-radius:50%;place-self:center;background:radial-gradient(circle at 32% 28%,#56bd8f 0%,#2a9168 42%,#116247 74%,#0a4633 100%);box-shadow:0 1px 1px rgba(0,0,0,.35),inset 0 -1px 1px rgba(0,0,0,.3),inset 1px 1px 1px rgba(255,255,255,.45)}
.dots i.r{background:radial-gradient(circle at 32% 28%,#ff9a8f 0%,#e63e3e 42%,#b3141f 74%,#8c0d17 100%);box-shadow:0 1px 1px rgba(0,0,0,.35),inset 0 -1px 1px rgba(90,0,5,.35),inset 1px 1px 1px rgba(255,255,255,.5)}
/* 一筒：同心大轮 */
.tile-face.b1 .dots{display:block;position:relative;width:78%;height:78%}
.tile-face.b1 .dots i.e{display:none}
.tile-face.b1 .dots i{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 47%,#f37263 0%,#df3a35 17%,#b31622 28%,#17835f 32%,#0f6a4e 46%,#f8f1de 49%,#e6d5ae 55%,#1c8f6c 59%,#0c5a41 80%,#f8f1de 84%,#0c5a41 91%);box-shadow:0 .12em .2em rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 5px rgba(0,0,0,.28)}
.dots i.e{background:transparent;box-shadow:none}
/* 条牌：竹节棍——圆柱侧光+两道竹箍，圆头；五/七条见红，九条红绿蓝三色 */
.bars{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:86%;height:88%}
.bars i{position:relative;width:.3em;height:.74em;border-radius:.5em;place-self:center;background:linear-gradient(90deg,rgba(4,42,24,.55) 0%,rgba(18,104,64,.12) 22%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.06) 60%,rgba(4,42,24,.5) 100%),linear-gradient(180deg,#3cbf82 0%,#21915c 30%,#33a96f 58%,#1a7447 100%);box-shadow:0 .04em .05em rgba(0,0,0,.42),inset 0 0 .02em .01em rgba(2,38,22,.55)}
.bars i::before,.bars i::after{content:'';position:absolute;left:-.03em;right:-.03em;height:.075em;border-radius:.5em;background:linear-gradient(180deg,#0a4a2c,#1a7447 42%,#0a4a2c);box-shadow:0 .006em .012em rgba(255,255,255,.35)}
.bars i::before{top:29%}
.bars i::after{top:61%}
.bars i.r{background:linear-gradient(90deg,rgba(110,12,12,.55) 0%,rgba(160,30,30,.12) 22%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.06) 60%,rgba(110,12,12,.5) 100%),linear-gradient(180deg,#ef6b5e 0%,#d12f2f 30%,#e0493d 58%,#a81c1c 100%);box-shadow:0 .04em .05em rgba(0,0,0,.42),inset 0 0 .02em .01em rgba(90,5,5,.55)}
.bars i.r::before,.bars i.r::after{background:linear-gradient(180deg,#8a1414,#c22a2a 42%,#8a1414)}
.bars i.b{background:linear-gradient(90deg,rgba(10,35,110,.55) 0%,rgba(25,60,150,.12) 22%,rgba(255,255,255,.55) 46%,rgba(255,255,255,.06) 60%,rgba(10,35,110,.5) 100%),linear-gradient(180deg,#5aa0ef 0%,#2770c4 30%,#4086d8 58%,#175a9e 100%);box-shadow:0 .04em .05em rgba(0,0,0,.42),inset 0 0 .02em .01em rgba(8,30,80,.55)}
.bars i.b::before,.bars i.b::after{background:linear-gradient(180deg,#123f86,#2468b8 42%,#123f86)}
.bars i.e{visibility:hidden}
/* 一条·幺鸡：纯CSS手绘，全部em尺寸随牌缩放 */
.bird{position:relative;width:1.02em;height:1.52em}
.bd-tail{position:absolute;right:-.02em;bottom:.24em;width:.8em;height:1.1em;z-index:1}
.bd-tail em{position:absolute;bottom:0;left:50%;width:.09em;border-radius:.5em .5em .12em .12em;transform-origin:50% 100%;box-shadow:0 .02em .03em rgba(0,0,0,.35),inset -.015em 0 .02em rgba(0,0,0,.25),inset .015em 0 .02em rgba(255,255,255,.28)}
.bd-tail em:nth-child(1){height:.94em;background:linear-gradient(180deg,#2f9e67,#13603f);transform:translateX(-50%) rotate(30deg)}
.bd-tail em:nth-child(2){height:1.04em;background:linear-gradient(180deg,#f0675b,#c1272d);transform:translateX(-50%) rotate(10deg)}
.bd-tail em:nth-child(3){height:.94em;background:linear-gradient(180deg,#2f9e67,#13603f);transform:translateX(-50%) rotate(-12deg)}
.bd-body{position:absolute;left:.03em;bottom:.14em;width:.64em;height:.88em;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:radial-gradient(circle at 36% 28%,#36b37a 0%,#1d7d50 46%,#0c4c30 82%,#083a24 100%);box-shadow:0 .05em .07em rgba(0,0,0,.4),inset -.03em -.04em .06em rgba(0,0,0,.28),inset .03em .03em .05em rgba(255,255,255,.28);z-index:2}
.bd-body::after{content:'';position:absolute;left:.1em;bottom:.06em;width:.2em;height:.4em;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.02))}
.bd-wing{position:absolute;left:.14em;bottom:.4em;width:.42em;height:.52em;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ff8a7d 0%,#e0413a 45%,#a81414 100%);box-shadow:0 .02em .04em rgba(0,0,0,.4),inset 0 0 0 .015em rgba(120,10,10,.45);transform:rotate(-14deg);z-index:3}
.bd-wing::after{content:'';position:absolute;left:.1em;top:.12em;width:.2em;height:.26em;border-radius:50%;border-left:.02em solid rgba(255,220,210,.75);border-bottom:.02em solid rgba(255,220,210,.35)}
.bd-head{position:absolute;left:0;top:.05em;width:.46em;height:.46em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#36b37a 0%,#1d7d50 50%,#0a4229 100%);box-shadow:0 .03em .05em rgba(0,0,0,.4),inset -.02em -.02em .04em rgba(0,0,0,.3),inset .02em .02em .04em rgba(255,255,255,.3);z-index:4}
.bd-eye{position:absolute;right:.08em;top:.1em;width:.11em;height:.11em;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0 22%,#1d2430 26% 62%,#05080d 100%)}
.bd-beak{position:absolute;left:-.13em;top:.23em;width:0;height:0;border-style:solid;border-width:.075em .13em .075em 0;border-color:transparent #f4b73a transparent transparent;filter:drop-shadow(0 .01em .01em rgba(0,0,0,.3));z-index:3}
.bd-beak::after{content:'';position:absolute;left:.02em;top:.015em;width:0;height:0;border-style:solid;border-width:.05em .09em .05em 0;border-color:transparent #d99017 transparent transparent}
.bd-crest{position:absolute;left:.07em;top:-.085em;width:.3em;height:.15em;z-index:5}
.bd-crest em{position:absolute;bottom:0;width:.1em;height:.1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7d,#d83030 60%,#a81414);box-shadow:0 .01em .02em rgba(0,0,0,.3)}
.bd-crest em:nth-child(1){left:0;transform:rotate(-20deg)}
.bd-crest em:nth-child(2){left:.1em;bottom:.03em}
.bd-crest em:nth-child(3){left:.2em;transform:rotate(20deg)}
.bd-legs{position:absolute;left:.26em;bottom:-.01em;width:.3em;height:.19em;z-index:1}
.bd-legs em{position:absolute;bottom:0;width:.025em;height:.15em;background:linear-gradient(#5a3a1c,#2c1c0c)}
.bd-legs em::before{content:'';position:absolute;left:-.06em;bottom:-.01em;width:.1em;height:.02em;background:#2c1c0c;border-radius:2px}
.bd-legs em:nth-child(1){left:.05em}
.bd-legs em:nth-child(2){left:.2em}
.tile-back{background:linear-gradient(135deg,#3aa17d,#146149 55%,#0b4433);border:2px solid #f4ecd8;border-radius:5px;box-shadow:0 2px 4px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 10px rgba(0,0,0,.35)}
.mini-back{flex:0 0 auto;width:2.3vh;height:3.3vh;border-radius:2px;background:linear-gradient(135deg,#3aa17d,#146149 55%,#0b4433);border:1px solid #f4ecd8;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),1px 1px 2px rgba(0,0,0,.35)}
/* 牌墙 */
.walls{position:absolute;inset:0;z-index:1;pointer-events:none}
.wall{position:absolute}
.wall-top{top:10vh;left:50%;transform:translateX(-50%)}
.wall-left{left:6.4vw;top:18vh}
.wall-right{right:6.4vw;top:18vh}
.wall-row{display:flex;position:relative}
.wall-row.v{flex-direction:column}
.wall-row.h .mini-back{margin-left:-1.15vh}
.wall-row.h .mini-back:first-child{margin-left:0}
.wall-row.v .mini-back{margin-top:-1.55vh}
.wall-row.v .mini-back:first-child{margin-top:0}
.wall-top .back-row{position:absolute;left:-1.2vh;top:-1.5vh;z-index:-1;opacity:.85}
.wall-left::before,.wall-right::before{content:'';position:absolute;top:3px;bottom:3px;width:3px;background:linear-gradient(#f7f1e0,#d9c9a6);border-radius:2px}
.wall-left::before{right:-4px}
.wall-right::before{left:-4px}
/* 座位布局 */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.7vh;z-index:3}
.pinfo{position:relative;display:flex;align-items:center;gap:.6vh;background:rgba(5,38,31,.78);border:1px solid rgba(201,162,79,.5);border-radius:3vh;padding:.25vh .9vw .25vh .4vh;backdrop-filter:blur(2px)}
.avatar{width:3.4vh;height:3.4vh;border-radius:50%;background:linear-gradient(135deg,#1f7a5e,#0b4234);border:1px solid rgba(233,196,106,.85);display:flex;align-items:center;justify-content:center;font-size:1.8vh;color:#ffe9b0;font-weight:700;box-shadow:inset 0 1px 2px rgba(255,255,255,.25)}
.seat .name{font-size:1.5vh;color:#dfe9e2;white-space:nowrap;line-height:1.2}
.seat .name.host{color:#ffd76a;font-weight:700}
.seat.cur .pinfo{border-color:#e9c46a;box-shadow:0 0 12px rgba(233,196,106,.85);animation:pulseCur 1.1s ease-in-out infinite}
.seat.cur .pinfo::after{content:'';position:absolute;top:-1.4vh;left:50%;transform:translateX(-50%);border-left:.8vh solid transparent;border-right:.8vh solid transparent;border-bottom:1.2vh solid #ff9f1c;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@keyframes pulseCur{0%,100%{box-shadow:0 0 6px rgba(233,196,106,.5)}50%{box-shadow:0 0 16px rgba(233,196,106,.95)}}
.seat-me{left:50%;bottom:.8vh;transform:translateX(-50%);width:100%}
.seat-me .pinfo{position:absolute;left:1vw;bottom:1.4vh}
.seat-top{left:0;right:0;top:.8vh;width:100%}
.seat-left{left:.6vw;top:50%;transform:translateY(-50%);flex-direction:row;gap:1vw}
.seat-right{right:.6vw;top:50%;transform:translateY(-50%);flex-direction:row;gap:1vw}
.seat-left .pinfo,.seat-right .pinfo{flex:0 0 auto}
/* 自己手牌 */
.hand-me{display:none;gap:2px;justify-content:center;align-items:flex-end;flex-wrap:nowrap}
.seat-me .hand-me{width:100%;padding:.4vh 2.2vw .8vh;background:linear-gradient(to top,rgba(3,26,21,.9),rgba(3,26,21,0))}
.hand-me .tile{flex:1 1 0;min-width:0;width:auto;max-width:6.3vh;height:8.8vh;font-size:3.0vh;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.hand-me .tile:active,.hand-me .tile.sel{transform:translateY(-1.7vh)}
.hand-me .tile.sel{box-shadow:0 0 0 2px #e9c46a,0 0 14px rgba(233,196,106,.8),0 6px 10px rgba(0,0,0,.4)}
/* 他人手牌(牌背) */
.hand-back{display:none;justify-content:center}
.hand-back.top{flex-direction:row;gap:2px}
.hand-back.top .tile{width:2.5vh;height:3.6vh}
.seat-left .hand-back,.seat-right .hand-back{flex-direction:column}
.seat-left .hand-back .tile,.seat-right .hand-back .tile{width:2.5vh;height:3.6vh;margin-bottom:-1.8vh}
.seat-left .hand-back .tile:last-child,.seat-right .hand-back .tile:last-child{margin-bottom:0}
/* 副露 */
.meld-row{display:flex;gap:.5vh;min-height:4.2vh;justify-content:center;flex-wrap:wrap;z-index:5}
/* 副露(碰/杠)放在每位玩家自身的右上侧 */
.seat-me .meld-row{position:absolute;right:1vw;bottom:10.6vh;max-width:42vw;justify-content:flex-end}
.seat-top .meld-row{position:absolute;left:1vw;top:8.6vh;max-width:42vw;justify-content:flex-start}
.seat-left .meld-row,.seat-right .meld-row{flex-direction:column;align-items:center}
.seat-left .meld-row{position:relative;top:-10.5vh}
.seat-right .meld-row{position:relative;top:10.5vh}
.meld-group{display:flex;gap:1px;padding:2px;background:rgba(6,36,29,.8);border:1px solid rgba(201,162,79,.25);border-radius:3px}
.meld-group .tile{width:2.7vh;height:3.8vh;font-size:1.45vh;border-bottom-width:2px}
.meld-group.pop{animation:meldPop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes meldPop{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
/* 弃牌区 */
.discard-row{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:4.6vh;max-width:24vw}

/* ===== mahjong.js ===== */
const SUITS = ['w', 'b', 't'];

 ensure(){try{if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
 tone(freq,dur,type,vol,delay){try{this.ensure();if(!this.ctx)return;const t0=this.ctx.currentTime+(delay||0);const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.15,t0+.008);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t0);o.stop(t0+dur+.02)}catch(e){}},
 noise(dur,freq,q,vol,delay){try{this.ensure();if(!this.ctx)return;const t0=this.ctx.currentTime+(delay||0);const n=Math.floor(this.ctx.sampleRate*dur);const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=this.ctx.createBufferSource();s.buffer=buf;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=this.ctx.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(this.ctx.destination);s.start(t0)}catch(e){}},
 clack(){if(!sfxOn)return;const jitter=Math.random()*70;this.noise(.06,2100+jitter,1.2,.16);this.tone(180+Math.random()*50,.08,'triangle',.18);this.noise(.045,2600+jitter,1.4,.08,.018)},

function voiceMenu(){const list=[];const seen={};getZhVoices().forEach(v=>{const p=presetOfVoice(v);if(!p)return;if(seen[p.short]){const ex=list.find(m=>m.short===p.short);if(v.localService&&!ex.local)ex.uri=v.voiceURI;return}seen[p.short]=1;list.push({uri:v.voiceURI,short:p.short,name:p.name,pitch:p.pitch,rate:p.rate,local:!!v.localService})});list.sort((a,b)=>VOICE_PRESETS.findIndex(p=>p.short===a.short)-VOICE_PRESETS.findIndex(p=>p.short===b.short));list.push({uri:'',short:'默',name:'系统默认语音',pitch:1.08,rate:1.12,local:true});if(voiceURI&&!list.some(m=>m.uri===voiceURI))voiceURI='';return list}

function sayTile(t){if(SUITS.includes(t.suit))return NUMCN[t.value]+SUIT_NAMES[t.suit];if(t.suit==='f')return FENG_NAMES[t.value-1]+'风';return['红中','发财','白板'][t.value-1]||''}
function syncSndBtns(){const a=document.getElementById('btn-sfx'),b=document.getElementById('btn-voice');if(a){a.textContent=sfxOn?'🔊':'🔇';a.classList.toggle('off',!sfxOn)}if(b){b.textContent=voiceOn?'🗣':'🔈';b.classList.toggle('off',!voiceOn)}const c=document.getElementById('btn-voice-pick');if(c){let label='默',title='选择播报音色';try{const menu=voiceMenu();const m=menu.find(x=>x.uri===voiceURI)||menu[0];if(m){label=m.short;title=m.name}}catch(e){}c.textContent=label;c.title=title;c.classList.toggle('off',!voiceOn)}}

function cycleVoice(){try{Sound.ensure();const menu=voiceMenu();const i=menu.findIndex(m=>m.uri===voiceURI);const m=menu[(i+1)%menu.length];voiceURI=m.uri;localStorage.setItem('qhd-voice-uri',m.uri);if(!voiceOn){voiceOn=true;localStorage.setItem('qhd-voice','1')}syncSndBtns();speak('已切换，'+m.name)}catch(e){}}

const voiceObs={init:false,discardKey:'',meldSig:[],cursor:-1};
function resetVoiceObs(){voiceObs.init=false;voiceObs.discardKey='';voiceObs.meldSig=[];voiceObs.cursor=-1}
function observeVoice(){if(!game)return;const meldSig=game.players.map(p=>(p.melds||[]).map(m=>m.type+m.tiles.length).join('|'));
 if(!voiceObs.init){voiceObs.init=true;voiceObs.meldSig=meldSig;voiceObs.cursor=game.drawCursor;voiceObs.discardKey=game.lastDiscard?game.lastDiscard.fromSeat+'_'+game.lastDiscard.tile.id:'';return}
 for(let s=0;s<4;s++){if(meldSig[s]!==voiceObs.meldSig[s]){const old=voiceObs.meldSig[s]?voiceObs.meldSig[s].split('|'):[];const now=meldSig[s].split('|');if(now.length>old.length){const ty=now[now.length-1];if(ty.indexOf('pong')===0){Sound.peng();speak('碰')}else{Sound.gang();speak(ty.indexOf('darkKong')===0?'暗杠':'杠')}}else{Sound.gang();speak('补杠')}}}
 voiceObs.meldSig=meldSig;
 if(game.drawCursor!==voiceObs.cursor){voiceObs.cursor=game.drawCursor;Sound.draw()}
 const dk=game.lastDiscard?game.lastDiscard.fromSeat+'_'+game.lastDiscard.tile.id:'';
 if(dk&&dk!==voiceObs.discardKey){voiceObs.discardKey=dk;Sound.clack();speak(sayTile(game.lastDiscard.tile))}}
function buildFullDeck(){const d=[];let id=0;for(const s of SUITS)for(let v=1;v<=9;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:s,value:v});for(let v=1;v<=4;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:'f',value:v});for(let v=1;v<=3;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:'j',value:v});return d}
function shuffle(d){const a=d.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tileKey(t){return t.suit+t.value}
function isSameTile(a,b){return a.suit===b.suit&&a.value===b.value}
function nextTile(t){if(SUITS.includes(t.suit))return{suit:t.suit,value:t.value===9?1:t.value+1};if(t.suit==='f')return{suit:'f',value:t.value===4?1:t.value+1};if(t.suit==='j')return{suit:'j',value:t.value===3?1:t.value+1};throw new Error('未知牌型 '+t.suit)}
function findTile(deck,suit,value){return deck.find(t=>t.suit===suit&&t.value===value)}
function countTiles(ts){const m=new Map();for(const t of ts){const k=tileKey(t);m.set(k,(m.get(k)||0)+1)}return m}
function sortHand(h){const o={w:0,b:1,t:2,f:3,j:4};return h.slice().sort((a,b)=>{if(o[a.suit]!==o[b.suit])return o[a.suit]-o[b.suit];return a.value-b.value})}
function checkHu(hand,melds,wanTile){const q=checkQiDui(hand,wanTile);if(q)return{type:'qidui',details:q};const n=checkNormalHu(hand,melds,wanTile);if(n)return{type:'normal',details:n};return null}
function checkQiDui(hand,wanTile){const cnt=countTiles(hand);const wKey=wanTile?tileKey(wanTile):null;let wCnt=wKey?(cnt.get(wKey)||0):0;let npc=0,nsc=0;for(const[k,c]of cnt){if(k===wKey)continue;npc+=Math.floor(c/2);nsc+=c%2}if(wCnt<nsc)return null;const rw=wCnt-nsc;if(rw%2!==0)return null;const tp=npc+nsc+rw/2;if(tp!==7)return null;let rf=0;for(const[k,c]of cnt){if(k===wKey)continue;if(c>=4)rf++}const lv=rf>=3?3:rf>=2?2:rf>=1?1:0;const mp=[4,8,16,32][lv];return{level:lv,realFours:rf,multiplier:mp}}
function checkNormalHu(hand,melds,wanTile){const wKey=wanTile?tileKey(wanTile):null;const rc=countTiles(hand);let wCnt=wKey?(rc.get(wKey)||0):0;const cm=new Map();for(const[k,c]of rc){if(k!==wKey)cm.set(k,c)}const nk=[...cm.keys()];for(const key of nk){const cnt=cm.get(key);if(cnt>=2){cm.set(key,cnt-2);const ok=canFormAllSets(cm,wCnt);cm.set(key,cnt);if(ok)return{jiang:key}}}if(wCnt>=1){for(const key of nk){const cnt=cm.get(key);if(cnt>=1){cm.set(key,cnt-1);const ok=canFormAllSets(cm,wCnt-1);cm.set(key,cnt);if(ok)return{jiang:key+'+wan'}}}}if(wCnt>=2){if(canFormAllSets(cm,wCnt-2))return{jiang:'wan'}}return null}
function checkPengPengHu(hand,melds,wanTile){
 /* 严格碰碰胡：副露全为刻/杠，手牌只能分解为剩余刻子(混儿可顶)+一对将，不允许顺子 */
 if(!melds.every(m=>m.type==='pong'||m.type==='kong'||m.type==='buKong'||m.type==='darkKong'))return false;
 const groupsLeft=4-melds.length;
 if(groupsLeft<0)return false;
 const wKey=wanTile?tileKey(wanTile):null;
 const cnt=countTiles(hand);
 let wL=wKey?(cnt.get(wKey)||0):0;
 const real=new Map();
 for(const[k,c]of cnt){if(k!==wKey)real.set(k,c)}
 const groupsOK=(map,wild)=>{
   let need=0,realTiles=0;
   for(const[k,c]of map){if(c>0){realTiles+=c;const r=c%3;if(r===1)need+=2;else if(r===2)need+=1}}
   if(wild<need)return false;
   const left=wild-need;
   return left%3===0 && (realTiles+wild)===groupsLeft*3;
 };
 /* 将为两张混儿 */
 if(wL>=2&&groupsOK(real,wL-2))return true;
 for(const k of real.keys()){
   const c=real.get(k);
   if(c>=2){real.set(k,c-2);if(groupsOK(real,wL)){real.set(k,c);return true}real.set(k,c)}
   if(c>=1&&wL>=1){real.set(k,c-1);if(groupsOK(real,wL-1)){real.set(k,c);return true}real.set(k,c)}
 }
 return false;
}
function canFormAllSets(cm,wL){let fk=null;for(const[k,c]of cm){if(c>0){fk=k;break}}if(!fk)return wL%3===0;const cnt=cm.get(fk);const suit=fk[0];const val=parseInt(fk.slice(1),10);if(cnt>=3){cm.set(fk,cnt-3);if(canFormAllSets(cm,wL)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(cnt>=2&&wL>=1){cm.set(fk,cnt-2);if(canFormAllSets(cm,wL-1)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(cnt>=1&&wL>=2){cm.set(fk,cnt-1);if(canFormAllSets(cm,wL-2)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(['w','b','t'].includes(suit)&&val<=7){const k2=suit+(val+1),k3=suit+(val+2);const c2=cm.get(k2)||0,c3=cm.get(k3)||0;for(let m=0;m<4;m++){const wn=(m&1?1:0)+(m&2?1:0);if(wn>wL)continue;const nrK2=(m&1)?0:1,nrK3=(m&2)?0:1;if(c2<nrK2||c3<nrK3)continue;cm.set(fk,cnt-1);if(!(m&1))cm.set(k2,c2-1);if(!(m&2))cm.set(k3,c3-1);if(canFormAllSets(cm,wL-wn)){cm.set(fk,cnt);cm.set(k2,c2);cm.set(k3,c3);return true}cm.set(fk,cnt);cm.set(k2,c2);cm.set(k3,c3)}}return false}
function calcFenpai(huResult,hand,melds,wanTile,opts={}){const fans=[];let total=1;fans.push({name:'平胡',m:1});if(opts.isZiMo){fans.push({name:'自摸',m:2});total*=2}if(opts.isTian){fans.push({name:'天胡',m:10});total*=10}else if(opts.isDi){fans.push({name:'地胡',m:10});total*=10}if(huResult.type==='qidui'){const m=huResult.details.multiplier;const n=huResult.details.level===0?'七对':huResult.details.level===1?'豪华七对':huResult.details.level===2?'双豪华七对':'三豪华七对';fans.push({name:n,m});total*=m}if(opts.isPengPeng){fans.push({name:'碰碰胡',m:3});total*=3}if(opts.isDaDiaoChe){fans.push({name:'大吊车',m:4});total*=4}if(opts.isGangShangHua){fans.push({name:'杠上花',m:2});total*=2}if(opts.isHaiDiLaoYue){fans.push({name:'海底捞月',m:2});total*=2}const om=melds.some(x=>x.type==='pong'||x.type==='kong'||x.type==='buKong');if(!om&&!opts.isTian&&!opts.isDi){fans.push({name:'门清',m:2});total*=2}if(wanTile){const wk=tileKey(wanTile);const wh=hand.some(t=>tileKey(t)===wk);if(!wh){fans.push({name:'素胡',m:2});total*=2}}else{fans.push({name:'素胡',m:2});total*=2}if(opts.isHuangDiao){fans.push({name:'混吊',m:2});total*=2}return{fans,totalMultiplier:total,desc:fans.map(f=>f.name).join(' × ')}}
function liuJuDun(g){const t={0:13,1:7,2:8,3:13};return g>=4?0:(t[g]!=null?t[g]:13)}
function findDarkGangFeng(hand){const cnt=countTiles(hand);const r=[];for(const[k,c]of cnt)if(c===4&&k[0]==='f')r.push(k);return r}
function canPongOrKong(tile,wanTile){if(!wanTile)return true;return!isSameTile(tile,wanTile)}

const SEATS=['北','东','南','西'];
class QHDMahjongGame{constructor(){this.players=[0,1,2,3].map(i=>({seat:i,name:'玩家'+(i+1),hand:[],melds:[],discards:[],isGongzhu:false,scores:0}));this.deck=[];this.drawCursor=0;this.wanTile=null;this.wanKey=null;this.bankerSeat=1;this.currentSeat=1;this.phase='waiting';this.lastDiscard=null;this.gangCount=0;this.handStartSeat=1;this.isFirstDraw=[true,true,true,true];this.gangAfterDraw=false;this.result=null}
newRound(banker){if(banker!=null)this.bankerSeat=banker;this.handStartSeat=this.bankerSeat;for(const p of this.players){p.hand=[];p.melds=[];p.discards=[];p.isGongzhu=false}this.gangCount=0;this.isFirstDraw=[true,true,true,true];this.gangAfterDraw=false;this.lastDiscard=null;this.result=null;const full=shuffle(buildFullDeck());this.deck=full;this.drawCursor=0;this.phase='dealing'}
dealTiles(wallStartIndex,wanTile){const start=wallStartIndex*2;const before=this.deck.slice(0,start);const after=this.deck.slice(start);this.deck=[...after,...before];this.wanTile=wanTile;this.wanKey=tileKey(wanTile);const order=[0,1,2,3].map(i=>(this.handStartSeat+i)%4);let cursor=0;for(let round=0;round<3;round++)for(const seat of order)for(let k=0;k<4;k++){this.players[seat].hand.push(this.deck[cursor++])}for(let i=0;i<4;i++){const seat=order[i];const extra=i===0?2:1;for(let k=0;k<extra;k++)this.players[seat].hand.push(this.deck[cursor++])}this.drawCursor=cursor;for(let i=0;i<4;i++)this.players[i].hand=sortHand(this.players[i].hand);this.currentSeat=this.handStartSeat;this.phase='draw'}
findStartDarkGang(){const r=[];for(let i=0;i<4;i++){const fk=findDarkGangFeng(this.players[i].hand);if(fk.length>0)r.push({seat:i,fengKeys:fk})}return r}
executeStartDarkGang(seat,fengKey){const p=this.players[seat];const removed=[],remaining=[];for(const t of p.hand){if(tileKey(t)===fengKey&&removed.length<4)removed.push(t);else remaining.push(t)}p.hand=remaining;p.melds.push({type:'darkKong',tiles:removed,isAnGang:true});this.gangCount++;this.drawCursor++;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}}
drawTile(seat){if(this.phase!=='draw'||seat!==this.currentSeat||!this.canDraw())return null;const tile=this.deck[this.drawCursor++];this.players[seat].hand.push(tile);this.players[seat].hand=sortHand(this.players[seat].hand);this.phase='discard';const hu=this.checkZiMoHu(seat);return{tile,hu}}
canDraw(){const r=this.deck.length-this.drawCursor;const ld=liuJuDun(this.gangCount);if(ld===0)return false;return r>ld*2}
checkZiMoHu(seat){const p=this.players[seat];if(p.isGongzhu)return null;const hr=checkHu(p.hand,p.melds,this.wanTile);if(!hr)return null;const opts={isZiMo:true};const isB=seat===this.handStartSeat;opts.isTian=isB&&p.melds.length===0;opts.isDi=!isB&&this.isFirstDraw[seat]===true&&p.melds.length===0;opts.isGangShangHua=this.gangAfterDraw;const rem=this.deck.length-this.drawCursor;const ld=liuJuDun(this.gangCount);opts.isHaiDiLaoYue=rem<=ld*2+1;const mc=p.melds.filter(m=>m.type==='pong'||m.type==='kong'||m.type==='buKong').length;opts.isDaDiaoChe=mc>=3&&p.hand.length<=2;if(this.wanTile){const wk=tileKey(this.wanTile);const wc=p.hand.filter(t=>tileKey(t)===wk).length;opts.isHuangDiao=mc>=3&&p.hand.length===2&&wc>=1}
opts.isPengPeng=hr.type==='normal'&&checkPengPengHu(p.hand,p.melds,this.wanTile);
const fp=calcFenpai(hr,p.hand,p.melds,this.wanTile,opts);return{huResult:hr,opts,fenpai:fp}}
discard(seat,idx){if(this.phase!=='discard'||seat!==this.currentSeat)return null;const p=this.players[seat];const[d]=p.hand.splice(idx,1);p.hand=sortHand(p.hand);p.discards=p.discards||[];p.discards.push(d);this.lastDiscard={tile:d,fromSeat:seat};this.phase='action';this.isFirstDraw[seat]=false;if(this.wanTile&&tileKey(d)===this.wanKey)p.isGongzhu=true;this.gangAfterDraw=false;return d}
canPong(ds,ts){if(!this.lastDiscard||ts===ds)return false;const p=this.players[ts];if(p.isGongzhu)return false;const t=this.lastDiscard.tile;if(!canPongOrKong(t,this.wanTile))return false;const tk=tileKey(t),wk=this.wanKey;return p.hand.filter(x=>tileKey(x)===tk&&(!wk||tileKey(x)!==wk)).length>=2}
executePong(ts){const p=this.players[ts];const t=this.lastDiscard.tile;const tk=tileKey(t),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<2&&tileKey(x)===tk&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<2){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<2&&tileKey(x)===tk)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);p.melds.push({type:'pong',tiles:[t,...removed]});this.lastDiscard=null;this.currentSeat=ts;this.phase='discard'}
canMingGang(ds,ts){if(!this.lastDiscard||ts===ds)return false;const p=this.players[ts];if(p.isGongzhu)return false;const t=this.lastDiscard.tile;if(!canPongOrKong(t,this.wanTile))return false;const tk=tileKey(t),wk=this.wanKey;return p.hand.filter(x=>tileKey(x)===tk&&(!wk||tileKey(x)!==wk)).length>=3}
executeMingGang(ts){const p=this.players[ts];const t=this.lastDiscard.tile;const tk=tileKey(t),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<3&&tileKey(x)===tk&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<3){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<3&&tileKey(x)===tk)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);p.melds.push({type:'kong',tiles:[t,...removed]});this.gangCount++;this.lastDiscard=null;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}this.currentSeat=ts;this.phase='discard';this.gangAfterDraw=true}
canBuKong(ts){const p=this.players[ts];if(p.isGongzhu)return false;const wk=this.wanKey;const pm=p.melds.filter(m=>m.type==='pong');for(const m of pm){const k=tileKey(m.tiles[0]);if(p.hand.filter(x=>tileKey(x)===k&&(!wk||tileKey(x)!==wk)).length>=1)return true}return false}
executeBuKong(ts,mi){const p=this.players[ts];const m=p.melds[mi];if(m.type!=='pong')return false;const k=tileKey(m.tiles[0]),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<1&&tileKey(x)===k&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<1){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<1&&tileKey(x)===k)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);m.type='buKong';m.tiles.push(...removed);this.gangCount++;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}this.gangAfterDraw=true;return true}
findAnGangKeys(ts){const p=this.players[ts];if(!p||p.isGongzhu)return[];const cnt=countTiles(p.hand);const r=[];for(const[k,c]of cnt){if(c===4&&k!==this.wanKey)r.push(k)}return r}
canAnGang(ts){return this.findAnGangKeys(ts).length>0}
executeAnGang(ts,key){const p=this.players[ts];const removed=[],remaining=[];for(const x of p.hand){if(tileKey(x)===key&&removed.length<4)removed.push(x);else remaining.push(x)}if(removed.length!==4)return false;p.hand=sortHand(remaining);p.melds.push({type:'darkKong',tiles:removed,isAnGang:true});this.gangCount++;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}this.phase='discard';this.gangAfterDraw=true;return true}
findBuKongMelds(ts){const p=this.players[ts];if(!p||p.isGongzhu)return[];const wk=this.wanKey;const r=[];p.melds.forEach((m,mi)=>{if(m.type!=='pong')return;const k=tileKey(m.tiles[0]);if(k!==wk&&p.hand.some(x=>tileKey(x)===k))r.push({mi:mi,key:k})});return r}
resolveActionPriority(ds){const c=[];for(let i=1;i<=3;i++){const s=(ds+i)%4;if(this.canMingGang(ds,s))c.push({seat:s,action:'mingGang'});else if(this.canPong(ds,s))c.push({seat:s,action:'pong'})}if(c.length===0)return null;return c.reduce((a,b)=>((a.seat-ds+4)%4)<=((b.seat-ds+4)%4)?a:b)}
passAction(){this.lastDiscard=null;this.currentSeat=(this.currentSeat+1)%4;this.phase='draw'}
settle(ws,hi){const w=this.players[ws];const fp=hi.fenpai;const base=1;const pay=[];for(let i=0;i<4;i++){if(i===ws)continue;const amt=base*fp.totalMultiplier;w.scores+=amt;this.players[i].scores-=amt;pay.push({from:i,to:ws,amount:amt})}this.phase='gameover';return{winnerSeat:ws,fenpai:fp,payments:pay,totalMultiplier:fp.totalMultiplier}}
settleLiuJu(){this.phase='gameover';return{liuju:true}}
nextBanker(ws){return ws!==null?ws:(this.bankerSeat+1)%4}
}

/* ===== net.js (MQTT · 主机仲裁) ===== */
class MahjongNet{constructor(om){this.onMsg=om;this.client=null;this.roomCode=null;this.myId=null;this.isHost=false;this.topic='';this._buf=[];this._ok=false;this._seq=0}
static MQTT_URL='wss://broker.emqx.io:8084/mqtt';
static genRoomCode(){return Math.floor(100000+Math.random()*900000).toString()}
async createRoom(c){this.isHost=true;this.roomCode=c;this.topic='qhd-mj/'+c;this.myId='h'+Math.random().toString(36).slice(2,8);await this._c();await this._s();await this._p({type:'join',from:this.myId,name:'主机',isHost:true});return this.myId}
async joinRoom(c,name){this.isHost=false;this.roomCode=c;this.topic='qhd-mj/'+c;this.myId='g'+Math.random().toString(36).slice(2,8);await this._c();await this._s();await this._p({type:'join',from:this.myId,name:name||'玩家',isHost:false});return this.myId}
broadcast(obj){this._p(obj)}
async leave(){await this._p({type:'leave',from:this.myId});await this._u();if(this.client)this.client.end(true)}
_c(){return new Promise((rs,rj)=>{if(typeof mqtt==='undefined'){rj(new Error('MQTT.js 未加载，请检查网络'));return}this.client=mqtt.connect(MahjongNet.MQTT_URL,{clientId:this.myId,clean:true,connectTimeout:10000,reconnectPeriod:0});this.client.on('connect',()=>{this._ok=true;while(this._buf.length){const t=this._buf.shift();this.client.publish(this.topic,JSON.stringify(t),{qos:1})}rs()});this.client.on('message',(tp,pld)=>{try{const m=JSON.parse(pld.toString());if(m.from===this.myId)return;if(m.to&&m.to!==this.myId)return;this._h(m)}catch(e){}});this.client.on('error',(e)=>{if(!this._ok)rj(e)});this.client.on('close',()=>{if(this._ok)this.onMsg('disconnected',{});this._ok=false});setTimeout(()=>{if(!this._ok){try{this.client.end(true)}catch(e){}rj(new Error('连接超时(15s)，请检查网络或稍后重试'))}},15000)})}
_s(){return new Promise(rs=>this.client.subscribe(this.topic,{qos:1},()=>rs()))}
_u(){return new Promise(rs=>{if(!this.client)return rs();this.client.unsubscribe(this.topic,()=>rs())})}
_p(m){if(!this._seq)this._seq=0;if(!m.from)m.from=this.myId;m.seq=++this._seq;const p=JSON.stringify(m);if(!this._ok||!this.client){this._buf.push(m);return}this.client.publish(this.topic,p,{qos:1})}
_h(m){switch(m.type){case'state':this.onMsg('state',m.data);break;case'action':this.onMsg('action',{fromPeerId:m.from,action:m.action});break;case'join':this.onMsg('peer-join',{peerId:m.from,name:m.name,isHost:m.isHost});break;case'leave':this.onMsg('peer-leave',{peerId:m.from});break;case'start-game':this.onMsg('start-game',{players:m.players,mySeat:m.mySeat});break;case'roster':this.onMsg('roster',m.data);break;case'notice':this.onMsg('notice',{text:m.text});break}}
destroy(){try{this.client&&this.client.end(true)}catch(e){}this.client=null;this._ok=false}
}

function doDiscard(seat,idx){const p=game.players[seat];if(!p||idx<0||idx>=p.hand.length)return;if(pending&&pending.kind==='self'&&pending.seat===seat){clearTimeout(pending.timer);pending=null}const d=game.discard(seat,idx);if(!d)return;selIdx=-1;disarmWan();clearTurnClock();renderAll();broadcastFull();afterDiscard()}
function afterDiscard(){const ds=game.lastDiscard.fromSeat;const offers={};for(let i=1;i<=3;i++){const s=(ds+i)%4;const ch=[];if(game.canMingGang(ds,s))ch.push('gang');if(game.canPong(ds,s))ch.push('pong');if(ch.length)offers[s]=ch}const seats=Object.keys(offers).map(Number);if(!seats.length){game.passAction();renderAll();broadcastFull();nextSeatDraw();return}const id=promptSeq++;pending={id:id,kind:'claim',ds:ds,offers:offers,responses:{},timer:null};seats.forEach(s=>{if(isAI(s))setTimeout(()=>claimAnswer(s,aiClaimChoice(offers[s]),id),400+Math.random()*500)});pending.timer=setTimeout(()=>{if(!pending||pending.id!==id)return;seats.forEach(s=>{if(!pending.responses[s])pending.responses[s]='pass'});resolveClaim(id)},18000);setTurnClock(18000);renderAll();broadcastFull()}
function aiClaimChoice(ch){if(ch.indexOf('gang')>=0&&Math.random()<0.5)return 'gang';if(ch.indexOf('pong')>=0&&Math.random()<0.5)return 'pong';return 'pass'}
function claimAnswer(seat,choice,id){if(!pending||pending.kind!=='claim'||pending.id!==id)return;if(pending.responses[seat])return;if(pending.offers[seat].indexOf(choice)<0&&choice!=='pass')return;pending.responses[seat]=choice;const seats=Object.keys(pending.offers).map(Number);renderAll();broadcastFull();if(seats.every(s=>pending.responses[s])){clearTimeout(pending.timer);resolveClaim(id)}}
function resolveClaim(id){if(!pending||pending.id!==id)return;const pp=pending;pending=null;clearTurnClock();let winner=-1,choice=null;for(let i=1;i<=3;i++){const s=(pp.ds+i)%4;const c=pp.responses[s];if(c==='gang'){winner=s;choice='gang';break}if(c==='pong'&&winner<0){winner=s;choice='pong'}}if(winner<0){game.passAction();renderAll();broadcastFull();nextSeatDraw();return}if(choice==='gang'){game.executeMingGang(winner);sendNotice('▶ '+SEATS[winner]+'家 明杠')}else{game.executePong(winner);sendNotice('▶ '+SEATS[winner]+'家 碰')}renderAll();broadcastFull();beginSelfTurn(winner,choice==='gang')}

// ============ 单机模式 ============
function startGame(){mode='single';mySeat=0;pending=null;remotePrompt=null;shownResultId=null;gameStarted=false;animDiscardKey='';animMeldSig={};wanArmIdx=-1;clearTurnClock();Sound.ensure();syncSndBtns();hideWait();enterTable();hostStartGame();speak('游戏开始')}
function hostStartGame(){game=new QHDMahjongGame();const ws=Math.floor(Math.random()*34);const deck=shuffle(buildFullDeck());const wi=Math.floor(Math.random()*deck.length);const wt={suit:deck[wi].suit,value:deck[wi].value};const nw=nextTile(wt);const aw=findTile(deck,nw.suit,nw.value);game.newRound();resetVoiceObs();game.dealTiles(ws,aw);sendNotice('🎮 游戏开始');speak('混儿是'+sayTile(aw));const dk=game.findStartDarkGang();for(const it of dk){sendNotice(SEATS[it.seat]+'家起手风牌暗杠');game.executeStartDarkGang(it.seat,it.fengKeys[0])}game.phase='discard';renderAll();if(mode==='single'){setTimeout(()=>{beginSelfTurn(game.currentSeat)},600)}}
// ============ 联机模式（主机仲裁） ============
function rosterPeople(){return hostPeers.slice().sort((a,b)=>a.seat-b.seat).map(p=>({name:p.name,me:p.peerId===net.myId}))}
function broadcastRoster(started){net.broadcast({type:'roster',from:net.myId,data:{roomCode:curCode,peers:rosterPeople(),count:hostPeers.length,started:!!started}})}
function showWait(people,code){const w=document.getElementById('room-wait');w.style.display='flex';document.getElementById('rw-code').textContent=code||curCode||'------';const box=document.getElementById('rw-seats');box.innerHTML='';for(let i=0;i<4;i++){const p=people&&people[i];const d=document.createElement('div');d.className='rw-seat'+(p?' on':'');const nm=document.createElement('div');nm.textContent=p?p.name:'虚位以待';d.appendChild(nm);if(p&&p.me){const who=document.createElement('div');who.className='rw-who';who.textContent='（我）';d.appendChild(who)}box.appendChild(d)}const st=document.getElementById('rw-status');const n=people?people.filter(x=>x).length:0;st.textContent=n>=4?'人齐，即将开局…':'已加入 '+n+'/4 人，等待队友…'}
function hideWait(){document.getElementById('room-wait').style.display='none'}
async function createRoom(){mode='online';const lb=document.getElementById('lobby-status');lb.textContent='连接 MQTT 服务器...';net=new MahjongNet((t,d)=>netMsg(t,d));try{const code=MahjongNet.genRoomCode();await net.createRoom(code);curCode=code;onlineStarting=false;gameStarted=false;hostPeers=[{peerId:net.myId,seat:0,name:'你(主机)',joined:true}];lb.textContent='✅ 房间已创建，进入等待';enterTable();showWait(rosterPeople(),code);broadcastRoster()}catch(e){lb.textContent='❌ 连接失败：'+e.message}}
async function joinRoom(){mode='online';const code=document.getElementById('join-code').value.trim();if(!code){document.getElementById('lobby-status').textContent='请输入6位房间号';return}const lb=document.getElementById('lobby-status');lb.textContent='连接服务器...';net=new MahjongNet((t,d)=>netMsg(t,d));try{await net.joinRoom(code,'玩家'+Math.floor(Math.random()*90+10));curCode=code;onlineStarting=false;gameStarted=false;lb.textContent='✅ 已连接，进入房间';enterTable();showWait([{name:'你（玩家）',me:true}],code)}catch(e){lb.textContent='❌ 连接失败：'+e.message}}
function beginOnlineGame(){const arr=hostPeers.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}arr.forEach((p,i)=>p.seat=i);const mine=hostPeers.find(p=>p.peerId===net.myId);gameStarted=true;hostStartGame();arr.forEach(p=>{game.players[p.seat].name=p.name});const players=arr.slice().sort((a,b)=>a.seat-b.seat).map(p=>({seat:p.seat,name:p.name}));hostPeers.forEach(p=>{net.broadcast({type:'start-game',from:net.myId,to:p.peerId,players:players,mySeat:p.seat})});hideWait();mySeat=mine.seat;selIdx=-1;sendNotice('🎮 开局！混儿是「'+td(game.wanTile).text+'」');renderAll();setTimeout(broadcastFull,400);setTimeout(()=>{broadcastFull();beginSelfTurn(game.currentSeat)},1600)}
function netMsg(t,d){console.log('[NET]',t,d);switch(t){
case'peer-join':if(!net.isHost)break;if(!hostPeers.find(p=>p.peerId===d.peerId)){if(gameStarted){broadcastRoster(true);break}const ns=hostPeers.length;if(ns<4){hostPeers.push({peerId:d.peerId,seat:ns,name:d.name||('玩家'+(ns+1)),joined:true});sendNotice('👥 '+(d.name||'玩家')+' 加入房间');showWait(rosterPeople(),curCode);broadcastRoster();if(hostPeers.length>=4&&!onlineStarting){onlineStarting=true;showWait(rosterPeople(),curCode);setTimeout(beginOnlineGame,1400)}}}break;
case'peer-leave':if(!net.isHost||gameStarted)break;const i=hostPeers.findIndex(p=>p.peerId===d.peerId);if(i>0){sendNotice('👋 '+hostPeers[i].name+' 离开');hostPeers.splice(i,1);showWait(rosterPeople(),curCode);broadcastRoster()}break;
case'roster':if(gameStarted)break;if(d.started){document.getElementById('rw-status').textContent='牌局已开始，请等待下一局';break}showWait(d.peers,d.roomCode);break;
case'start-game':enterTable();hideWait();gameStarted=true;remotePrompt=null;mySeat=d.mySeat;game=new QHDMahjongGame();game.phase='waiting';resetVoiceObs();Sound.ensure();syncSndBtns();wanArmIdx=-1;for(let i=0;i<4;i++){if(d.players[i])game.players[i].name=d.players[i].name}logMsg('🎮 游戏开始');speak('游戏开始');break;
case'state':applyRemoteState(d);break;
case'notice':logMsg(d.text);break;
case'disconnected':logMsg('❌ 网络连接断开，请刷新页面重进房间');break;
case'action':if(net.isHost)handlePeerAction(d);break}}
function applyRemoteState(s){if(!game)game=new QHDMahjongGame();const st=s.state;Object.assign(game,{deck:st.deck,drawCursor:st.drawCursor,wanTile:st.wanTile,wanKey:st.wanKey,bankerSeat:st.bankerSeat,currentSeat:st.currentSeat,phase:st.phase,lastDiscard:st.lastDiscard,gangCount:st.gangCount,handStartSeat:st.handStartSeat,isFirstDraw:st.isFirstDraw,gangAfterDraw:st.gangAfterDraw,result:st.result||null});game.players=st.players;remotePrompt=st.prompt||null;if(st.result&&st.result._id&&st.result._id!==shownResultId){shownResultId=st.result._id;showResult(st.result)}renderAll()}
function handlePeerAction(d){if(!game||game.phase==='gameover')return;const a=d.action;const hp=hostPeers.find(p=>p.peerId===d.fromPeerId);const seat=hp?hp.seat:-1;if(a.type==='discard'){if(seat===a.seat)doDiscard(a.seat,a.tileIndex);return}if(a.type==='respond'){if(seat<0)return;if(a.kind==='claim')claimAnswer(seat,a.choice,a.promptId);else if(a.kind==='self')selfAnswer(seat,a.choice,a.payload,a.promptId)}}
function serializeForClient(forPeerId){const hp=hostPeers.find(p=>p.peerId===forPeerId);const peerSeat=hp?hp.seat:-1;const players=game.players.map(p=>({seat:p.seat,name:p.name,hand:peerSeat===p.seat?p.hand:[],handCount:p.hand.length,melds:p.melds,discards:p.discards||[],isGongzhu:p.isGongzhu}));return{state:{players:players,deck:[],drawCursor:game.drawCursor,wanTile:game.wanTile,wanKey:game.wanKey,bankerSeat:game.bankerSeat,currentSeat:game.currentSeat,phase:game.phase,lastDiscard:game.lastDiscard,gangCount:game.gangCount,handStartSeat:game.handStartSeat,isFirstDraw:game.isFirstDraw,gangAfterDraw:game.gangAfterDraw,result:game.result||null,prompt:peerSeat>=0?promptFor(peerSeat):null}}}
let bcTimer=null;
function doBroadcast(){if(!net||!net.isHost||!game)return;hostPeers.forEach(p=>{net.broadcast({type:'state',from:net.myId,to:p.peerId,data:serializeForClient(p.peerId)})})}
function broadcastFull(){if(!net||!net.isHost||!game)return;if(bcTimer)return;bcTimer=setTimeout(()=>{bcTimer=null;doBroadcast()},150)}
function flushBroadcast(){if(bcTimer){clearTimeout(bcTimer);bcTimer=null}doBroadcast()}
function onlineHostStart(){}
setMode('single');
syncSndBtns();
</script>
