<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>秦皇岛麻将 · 民间版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1b2a;color:#e0e1dd;min-height:100vh;overflow-x:hidden;max-width:480px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;transition:all .15s}
button:disabled{opacity:.4;cursor:not-allowed}
#lobby{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#lobby h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#e9c46a,#f4a261);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#lobby .sub{color:#778da9;margin-bottom:32px;font-size:13px;text-align:center;padding:0 20px}
#lobby .panel{background:#1b263b;border:1px solid #415a77;border-radius:16px;padding:28px;width:100%;max-width:340px}
#lobby .mode{display:flex;gap:10px;margin-bottom:20px}
#lobby .mode button{flex:1;padding:10px;background:#415a77;color:#fff;font-size:14px;font-weight:600}
#lobby .mode button.active{background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b}
#lobby input{width:100%;padding:12px;background:#0d1b2a;border:1px solid #415a77;border-radius:8px;color:#e0e1dd;font-size:16px;margin-bottom:12px;text-align:center;letter-spacing:2px}
.lobby-btn{width:100%;padding:12px;background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b;font-size:15px;font-weight:700}
.room-info{text-align:center;margin-top:14px;color:#778da9;font-size:12px}
.room-info b{color:#e9c46a;font-size:22px}
.lobby-status{text-align:center;margin-top:14px;font-size:13px;color:#e9c46a;min-height:18px}
#lobby .hint{margin-top:20px;font-size:11px;color:#415a77;text-align:center;line-height:1.6}
#table{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,#1b263b,#0d1b2a);max-width:480px;margin:0 auto;overflow:hidden}
.tile{display:inline-flex;align-items:center;justify-content:center;font-weight:700;user-select:none;border-radius:4px}
.tile-face{background:#f8f9fa;border:1px solid #adb5bd;color:#1b263b;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile-face.wan{color:#d00000}.tile-face.bing{color:#0077b6}.tile-face.tiao{color:#2d6a4f}
.tile-face.feng,.tile-face.jian{color:#1b263b}
.tile.wan-tile{border:2px solid #e9c46a}
.tile-back{background:linear-gradient(135deg,#1b263b,#415a77);border:1px solid #778da9}
/* 座位布局 */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat .name{font-size:11px;color:#e0e1dd;background:#415a77;padding:1px 8px;border-radius:8px}
.seat .name.host{background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b;font-weight:700}
.seat-me{left:50%;bottom:6px;transform:translateX(-50%);width:96%}
.seat-top{left:50%;top:6px;transform:translateX(-50%)}
.seat-left{left:6px;top:50%;transform:translateY(-50%)}
.seat-right{right:6px;top:50%;transform:translateY(-50%)}
/* 手牌区 */
.hand-me{display:flex;gap:2px;padding:6px;background:#2d4a6b;border-radius:8px;min-height:52px;justify-content:center;flex-wrap:wrap}
.hand-me .tile{width:32px;height:44px;font-size:17px;cursor:pointer;transition:transform .1s}
.hand-me .tile:active{transform:translateY(-4px)}
/* 背面手牌 */
.hand-back{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:120px}
.hand-back.top .tile{width:18px;height:26px}
.hand-back.side .tile{width:22px;height:30px}
/* 副露 */
.meld-row{display:flex;gap:4px;min-height:28px;justify-content:center;flex-wrap:wrap}
.meld-group{display:flex;gap:1px;padding:1px;background:#1b263b;border-radius:3px}
.meld-group .tile{width:20px;height:28px;font-size:12px}
/* 弃牌 */
.discard-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:120px;min-height:26px}
.discard-row .tile{width:22px;height:30px;font-size:13px}
.discard-row .tile.last{box-shadow:0 0 0 2px #e9c46a}
/* 中央信息 */
.center-info{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center}
.center-info .phase{font-size:20px;color:#e9c46a;margin-bottom:6px}
.center-info .wan-info{font-size:12px;color:#778da9}
.center-info .wan-info .tile{width:22px;height:32px;font-size:14px;display:inline-flex;vertical-align:middle}
/* 按钮 */
.start-bar{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:10px;z-index:20}
.action-bar{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.action-bar button{padding:8px 18px;font-size:14px;font-weight:700}
.btn-primary{background:linear-gradient(135deg,#e9c46a,#f4a261);color:#1b263b}
.btn-ghost{background:#415a77;color:#fff}
/* 结算弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay .panel{background:#1b263b;border:1px solid #415a77;border-radius:16px;padding:24px;min-width:280px;text-align:center}
.overlay h2{font-size:20px;margin-bottom:12px}
.overlay .total{font-size:28px;color:#e9c46a;font-weight:700;margin:12px 0}
.overlay .payments{margin:12px 0;font-size:13px;color:#778da9;line-height:1.6}
/* 消息 */
.msg-log{position:absolute;right:4px;top:4px;width:140px;max-height:120px;overflow-y:auto;background:rgba(13,27,42,.9);border:1px solid #415a77;border-radius:6px;padding:6px;font-size:11px}
.msg-log div{margin-bottom:2px;color:#a9d6e5}
/* 状态tag */
.tag{font-size:10px;padding:0 6px;border-radius:6px;margin-left:4px}
.tag.current{background:#e9c46a;color:#1b263b}
.tag.gongzhu{background:#e63946;color:#fff}
</style>
</head>
<body>

<!-- 大厅 -->
<div id="lobby">
  <h1>🀄 秦皇岛麻将</h1>
  <div class="sub">河北民间版 · 仅自摸胡 · 1张混儿(+1)<br>起手风牌可暗杠 · 倍数乘法算分</div>
  <div class="panel">
    <div class="mode">
      <button id="btn-single" class="active" onclick="setMode('single')">单机练习</button>
      <button id="btn-online" onclick="setMode('online')">联机对战</button>
    </div>
    <div id="lobby-single"><button class="lobby-btn" onclick="startGame()">🎮 开始单机游戏</button></div>
    <div id="lobby-online" style="display:none">
      <button class="lobby-btn" onclick="createRoom()">🎲 创建房间</button>
      <div class="room-info" id="create-info"></div>
      <div style="height:12px"></div>
      <input id="join-code" placeholder="输入6位房间号" maxlength="6">
      <button class="lobby-btn" onclick="joinRoom()">🚪 加入房间</button>
    </div>
    <div class="lobby-status" id="lobby-status"></div>
  </div>
  <div class="hint">💡 联机需4人都打开此页面。创建房间后把6位房间号发给朋友，朋友输入即可加入<br>✅ 联机走 EMQX 公共 MQTT，国内直连，无需科学上网</div>
</div>

<!-- 牌桌 -->
<div id="table">
  <div class="seat seat-top" id="seat-1">
    <div class="name">北 · 上家</div>
    <div class="hand-back top"></div>
    <div class="meld-row"></div>
    <div class="discard-row"></div>
  </div>
  <div class="seat seat-left" id="seat-2">
    <div class="name">东 · 庄家</div>
    <div class="hand-back side"></div>
    <div class="meld-row"></div>
    <div class="discard-row"></div>
  </div>
  <div class="seat seat-right" id="seat-3">
    <div class="name">西 · 对家</div>
    <div class="hand-back side"></div>
    <div class="meld-row"></div>
    <div class="discard-row"></div>
  </div>
  <div class="seat seat-me" id="seat-0">
    <div class="name">南 · 你</div>
    <div class="hand-me"></div>
    <div class="meld-row"></div>
    <div class="discard-row"></div>
  </div>
  <div class="center-info" id="center-info"><div class="phase">等待开始</div></div>
  <div class="start-bar" id="start-bar" style="display:none"><button class="btn-primary" onclick="onlineHostStart()">🎮 主机开始游戏</button></div>
  <div class="action-bar" id="action-bar" style="display:none"></div>
  <div class="msg-log" id="msg-log"></div>
</div>

<!-- 结算 -->
<div id="result-overlay" class="overlay" style="display:none">
  <div class="panel">
    <h2 id="result-title">🎉 自摸胡！</h2>
    <div class="total" id="result-total">0 分</div>
    <div class="payments" id="result-detail"></div>
    <button class="btn-primary" onclick="closeResult()" style="padding:10px 28px">继续</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js" onerror="alert('MQTT.js 加载失败，联机功能不可用，但单机模式正常')"></script>
<script>
/* ===== mahjong.js ===== */
const SUITS = ['w', 'b', 't'];
const SUIT_NAMES = { w: '万', b: '饼', t: '条' };
const FENG_NAMES = ['东', '南', '西', '北'];
const JIAN_NAMES = ['中', '发', '白'];
function buildFullDeck(){const d=[];let id=0;for(const s of SUITS)for(let v=1;v<=9;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:s,value:v});for(let v=1;v<=4;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:'f',value:v});for(let v=1;v<=3;v++)for(let k=0;k<4;k++)d.push({id:id++,suit:'j',value:v});return d}
function shuffle(d){const a=d.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tileKey(t){return t.suit+t.value}
function isSameTile(a,b){return a.suit===b.suit&&a.value===b.value}
function nextTile(t){if(SUITS.includes(t.suit))return{suit:t.suit,value:t.value===9?1:t.value+1};if(t.suit==='f')return{suit:'f',value:t.value===4?1:t.value+1};if(t.suit==='j')return{suit:'j',value:t.value===3?1:t.value+1};throw new Error('未知牌型 '+t.suit)}
function findTile(deck,suit,value){return deck.find(t=>t.suit===suit&&t.value===value)}
function countTiles(ts){const m=new Map();for(const t of ts){const k=tileKey(t);m.set(k,(m.get(k)||0)+1)}return m}
function sortHand(h){const o={w:0,b:1,t:2,f:3,j:4};return h.slice().sort((a,b)=>{if(o[a.suit]!==o[b.suit])return o[a.suit]-o[b.suit];return a.value-b.value})}
function checkHu(hand,melds,wanTile){const q=checkQiDui(hand,wanTile);if(q)return{type:'qidui',details:q};const n=checkNormalHu(hand,melds,wanTile);if(n)return{type:'normal',details:n};return null}
function checkQiDui(hand,wanTile){const cnt=countTiles(hand);const wKey=wanTile?tileKey(wanTile):null;let wCnt=wKey?(cnt.get(wKey)||0):0;let npc=0,nsc=0;for(const[k,c]of cnt){if(k===wKey)continue;npc+=Math.floor(c/2);nsc+=c%2}if(wCnt<nsc)return null;const rw=wCnt-nsc;if(rw%2!==0)return null;const tp=npc+nsc+rw/2;if(tp!==7)return null;let rf=0;for(const[k,c]of cnt){if(k===wKey)continue;if(c>=4)rf++}const lv=rf>=3?3:rf>=2?2:rf>=1?1:0;const mp=[4,8,16,32][lv];return{level:lv,realFours:rf,multiplier:mp}}
function checkNormalHu(hand,melds,wanTile){const wKey=wanTile?tileKey(wanTile):null;const rc=countTiles(hand);let wCnt=wKey?(rc.get(wKey)||0):0;const cm=new Map();for(const[k,c]of rc){if(k!==wKey)cm.set(k,c)}const nk=[...cm.keys()];for(const key of nk){const cnt=cm.get(key);if(cnt>=2){cm.set(key,cnt-2);const ok=canFormAllSets(cm,wCnt);cm.set(key,cnt);if(ok)return{jiang:key}}}if(wCnt>=1){for(const key of nk){const cnt=cm.get(key);if(cnt>=1){cm.set(key,cnt-1);const ok=canFormAllSets(cm,wCnt-1);cm.set(key,cnt);if(ok)return{jiang:key+'+wan'}}}}if(wCnt>=2){if(canFormAllSets(cm,wCnt-2))return{jiang:'wan'}}return null}
function canFormAllSets(cm,wL){let fk=null;for(const[k,c]of cm){if(c>0){fk=k;break}}if(!fk)return wL>0&&wL%3===0;const cnt=cm.get(fk);const suit=fk[0];const val=parseInt(fk.slice(1),10);if(cnt>=3){cm.set(fk,cnt-3);if(canFormAllSets(cm,wL)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(cnt>=2&&wL>=1){cm.set(fk,cnt-2);if(canFormAllSets(cm,wL-1)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(cnt>=1&&wL>=2){cm.set(fk,cnt-1);if(canFormAllSets(cm,wL-2)){cm.set(fk,cnt);return true}cm.set(fk,cnt)}if(['w','b','t'].includes(suit)&&val<=7){const k2=suit+(val+1),k3=suit+(val+2);const c2=cm.get(k2)||0,c3=cm.get(k3)||0;for(let m=0;m<4;m++){const wn=(m&1?1:0)+(m&2?1:0);if(wn>wL)continue;const nrK2=(m&1)?0:1,nrK3=(m&2)?0:1;if(c2<nrK2||c3<nrK3)continue;cm.set(fk,cnt-1);if(!(m&1))cm.set(k2,c2-1);if(!(m&2))cm.set(k3,c3-1);if(canFormAllSets(cm,wL-wn)){cm.set(fk,cnt);cm.set(k2,c2);cm.set(k3,c3);return true}cm.set(fk,cnt);cm.set(k2,c2);cm.set(k3,c3)}}return false}
function calcFenpai(huResult,hand,melds,wanTile,opts={}){const fans=[];let total=1;fans.push({name:'平胡',m:1});if(opts.isZiMo){fans.push({name:'自摸',m:2});total*=2}if(opts.isTian){fans.push({name:'天胡',m:10});total*=10}else if(opts.isDi){fans.push({name:'地胡',m:10});total*=10}if(huResult.type==='qidui'){const m=huResult.details.multiplier;const n=huResult.details.level===0?'七对':huResult.details.level===1?'豪华七对':huResult.details.level===2?'双豪华七对':'三豪华七对';fans.push({name:n,m});total*=m}const hp=melds.some(x=>x.type==='pong'||x.type==='kong'||x.type==='buKong');if(hp){fans.push({name:'碰碰胡',m:3});total*=3}if(opts.isDaDiaoChe){fans.push({name:'大吊车',m:4});total*=4}if(opts.isGangShangHua){fans.push({name:'杠上花',m:2});total*=2}if(opts.isHaiDiLaoYue){fans.push({name:'海底捞月',m:2});total*=2}const om=melds.some(x=>x.type==='pong'||x.type==='kong'||x.type==='buKong');if(!om&&!opts.isTian&&!opts.isDi){fans.push({name:'门清',m:2});total*=2}if(wanTile){const wk=tileKey(wanTile);const wh=hand.some(t=>tileKey(t)===wk);if(!wh){fans.push({name:'素胡',m:2});total*=2}}else{fans.push({name:'素胡',m:2});total*=2}if(opts.isHuangDiao){fans.push({name:'混吊',m:2});total*=2}return{fans,totalMultiplier:total,desc:fans.map(f=>f.name).join(' × ')}}
function liuJuDun(g){const t={0:13,1:7,2:8,3:13};return g>=4?0:(t[g]!=null?t[g]:13)}
function findDarkGangFeng(hand){const cnt=countTiles(hand);const r=[];for(const[k,c]of cnt)if(c===4&&k[0]==='f')r.push(k);return r}
function canPongOrKong(tile,wanTile){if(!wanTile)return true;return!isSameTile(tile,wanTile)}

/* ===== game.js ===== */
const SEATS=['北','东','南','西'];
class QHDMahjongGame{constructor(){this.players=[0,1,2,3].map(i=>({seat:i,name:'玩家'+(i+1),hand:[],melds:[],isGongzhu:false,scores:0}));this.deck=[];this.drawCursor=0;this.wanTile=null;this.wanKey=null;this.bankerSeat=1;this.currentSeat=1;this.phase='waiting';this.lastDiscard=null;this.gangCount=0;this.handStartSeat=1;this.isFirstDraw=[true,true,true,true];this.gangAfterDraw=false}
newRound(banker){if(banker!=null)this.bankerSeat=banker;this.handStartSeat=this.bankerSeat;for(const p of this.players){p.hand=[];p.melds=[];p.isGongzhu=false}this.gangCount=0;this.isFirstDraw=[true,true,true,true];this.gangAfterDraw=false;this.lastDiscard=null;const full=shuffle(buildFullDeck());this.deck=full.slice(0,68);this.drawCursor=0;this.phase='dealing'}
dealTiles(wallStartIndex,wanTile){const start=wallStartIndex*2;const before=this.deck.slice(0,start);const after=this.deck.slice(start);this.deck=[...after,...before];this.wanTile=wanTile;this.wanKey=tileKey(wanTile);const order=[0,1,2,3].map(i=>(this.handStartSeat+i)%4);let cursor=0;for(let round=0;round<3;round++)for(const seat of order)for(let k=0;k<4;k++){this.players[seat].hand.push(this.deck[cursor++])}for(let i=0;i<4;i++){const seat=order[i];const extra=i===0?2:1;for(let k=0;k<extra;k++)this.players[seat].hand.push(this.deck[cursor++])}this.drawCursor=cursor;for(let i=0;i<4;i++)this.players[i].hand=sortHand(this.players[i].hand);this.currentSeat=this.handStartSeat;this.phase='draw'}
findStartDarkGang(){const r=[];for(let i=0;i<4;i++){const fk=findDarkGangFeng(this.players[i].hand);if(fk.length>0)r.push({seat:i,fengKeys:fk})}return r}
executeStartDarkGang(seat,fengKey){const p=this.players[seat];const removed=[],remaining=[];for(const t of p.hand){if(tileKey(t)===fengKey&&removed.length<4)removed.push(t);else remaining.push(t)}p.hand=remaining;p.melds.push({type:'darkKong',tiles:removed,isAnGang:true});this.gangCount++;this.drawCursor++;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}}
drawTile(seat){if(this.phase!=='draw'||seat!==this.currentSeat||!this.canDraw())return null;const tile=this.deck[this.drawCursor++];this.players[seat].hand.push(tile);this.players[seat].hand=sortHand(this.players[seat].hand);this.phase='discard';this.isFirstDraw[seat]=false;const hu=this.checkZiMoHu(seat);return{tile,hu}}
canDraw(){const r=this.deck.length-this.drawCursor;const ld=liuJuDun(this.gangCount);if(ld===0)return false;return r>ld*2}
checkZiMoHu(seat){const p=this.players[seat];if(p.isGongzhu)return null;const hr=checkHu(p.hand,p.melds,this.wanTile);if(!hr)return null;const opts={isZiMo:true};const isB=seat===this.handStartSeat;opts.isTian=isB&&p.melds.length===0;this.isFirstDraw[seat]=false;opts.isDi=!isB&&this.isFirstDraw[seat]===false&&p.melds.length===0;opts.isGangShangHua=this.gangAfterDraw;const rem=this.deck.length-this.drawCursor;const ld=liuJuDun(this.gangCount);opts.isHaiDiLaoYue=rem<=ld*2+1;const mc=p.melds.filter(m=>m.type==='pong'||m.type==='kong'||m.type==='buKong').length;opts.isDaDiaoChe=mc>=3&&p.hand.length<=2;if(this.wanTile){const wk=tileKey(this.wanTile);const wc=p.hand.filter(t=>tileKey(t)===wk).length;opts.isHuangDiao=mc>=3&&p.hand.length===2&&wc>=1}const fp=calcFenpai(hr,p.hand,p.melds,this.wanTile,opts);return{huResult:hr,opts,fenpai:fp}}
discard(seat,idx){if(this.phase!=='discard'||seat!==this.currentSeat)return null;const p=this.players[seat];const[d]=p.hand.splice(idx,1);p.hand=sortHand(p.hand);this.lastDiscard={tile:d,fromSeat:seat};this.phase='action';if(this.wanTile&&tileKey(d)===this.wanKey)p.isGongzhu=true;this.gangAfterDraw=false;return d}
canPong(ds,ts){if(!this.lastDiscard||ts===ds)return false;const p=this.players[ts];if(p.isGongzhu)return false;const t=this.lastDiscard.tile;if(!canPongOrKong(t,this.wanTile))return false;const tk=tileKey(t),wk=this.wanKey;return p.hand.filter(x=>tileKey(x)===tk&&(!wk||tileKey(x)!==wk)).length>=2}
executePong(ts){const p=this.players[ts];const t=this.lastDiscard.tile;const tk=tileKey(t),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<2&&tileKey(x)===tk&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<2){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<2&&tileKey(x)===tk)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);p.melds.push({type:'pong',tiles:[t,...removed]});this.lastDiscard=null;this.currentSeat=ts;this.phase='discard'}
canMingGang(ds,ts){if(!this.lastDiscard||ts===ds)return false;const p=this.players[ts];if(p.isGongzhu)return false;const t=this.lastDiscard.tile;if(!canPongOrKong(t,this.wanTile))return false;const tk=tileKey(t),wk=this.wanKey;return p.hand.filter(x=>tileKey(x)===tk&&(!wk||tileKey(x)!==wk)).length>=3}
executeMingGang(ts){const p=this.players[ts];const t=this.lastDiscard.tile;const tk=tileKey(t),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<3&&tileKey(x)===tk&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<3){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<3&&tileKey(x)===tk)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);p.melds.push({type:'kong',tiles:[t,...removed]});this.gangCount++;this.lastDiscard=null;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}this.currentSeat=ts;this.phase='discard';this.gangAfterDraw=true}
canBuKong(ts){const p=this.players[ts];if(p.isGongzhu)return false;const wk=this.wanKey;const pm=p.melds.filter(m=>m.type==='pong');for(const m of pm){const k=tileKey(m.tiles[0]);if(p.hand.filter(x=>tileKey(x)===k&&(!wk||tileKey(x)!==wk)).length>=1)return true}return false}
executeBuKong(ts,mi){const p=this.players[ts];const m=p.melds[mi];if(m.type!=='pong')return false;const k=tileKey(m.tiles[0]),wk=this.wanKey;const removed=[],remaining=[];for(const x of p.hand){if(removed.length<1&&tileKey(x)===k&&(!wk||tileKey(x)!==wk))removed.push(x);else remaining.push(x)}if(removed.length<1){const sr=remaining.slice();remaining.length=0;for(const x of sr){if(removed.length<1&&tileKey(x)===k)removed.push(x);else remaining.push(x)}}p.hand=sortHand(remaining);m.type='buKong';m.tiles.push(...removed);this.gangCount++;if(this.drawCursor<this.deck.length){p.hand.push(this.deck[this.drawCursor++]);p.hand=sortHand(p.hand)}this.gangAfterDraw=true;return true}
resolveActionPriority(ds){const c=[];for(let i=1;i<=3;i++){const s=(ds+i)%4;if(this.canMingGang(ds,s))c.push({seat:s,action:'mingGang'});else if(this.canPong(ds,s))c.push({seat:s,action:'pong'})}if(c.length===0)return null;return c.reduce((a,b)=>((a.seat-ds+4)%4)<=((b.seat-ds+4)%4)?a:b)}
passAction(){this.lastDiscard=null;this.currentSeat=(this.currentSeat+1)%4;this.phase='draw'}
settle(ws,hi){const w=this.players[ws];const fp=hi.fenpai;const base=1;const pay=[];for(let i=0;i<4;i++){if(i===ws)continue;const amt=base*fp.totalMultiplier;w.scores+=amt;this.players[i].scores-=amt;pay.push({from:i,to:ws,amount:amt})}this.phase='gameover';return{winnerSeat:ws,fenpai:fp,payments:pay,totalMultiplier:fp.totalMultiplier}}
settleLiuJu(){this.phase='gameover';return{liuju:true}}
nextBanker(ws){return ws!==null?ws:(this.bankerSeat+1)%4}
}

/* ===== net.js (MQTT · 主机仲裁) ===== */
class MahjongNet{constructor(om){this.onMsg=om;this.client=null;this.roomCode=null;this.myId=null;this.isHost=false;this.topic='';this._buf=[];this._ok=false;this._seq=0}
static MQTT_URL='wss://broker.emqx.io:8084/mqtt';
static genRoomCode(){return Math.floor(100000+Math.random()*900000).toString()}
async createRoom(c){this.isHost=true;this.roomCode=c;this.topic='qhd-mj/'+c;this.myId='h'+Math.random().toString(36).slice(2,8);await this._c();await this._s();await this._p({type:'join',from:this.myId,name:'主机',isHost:true});return this.myId}
async joinRoom(c,name){this.isHost=false;this.roomCode=c;this.topic='qhd-mj/'+c;this.myId='g'+Math.random().toString(36).slice(2,8);await this._c();await this._s();await this._p({type:'join',from:this.myId,name:name||'玩家',isHost:false});return this.myId}
broadcast(obj){this._p(obj)}
async leave(){await this._p({type:'leave',from:this.myId});await this._u();if(this.client)this.client.end(true)}
_c(){return new Promise((rs,rj)=>{if(typeof mqtt==='undefined'){rj(new Error('MQTT.js 未加载，请检查网络'));return}this.client=mqtt.connect(MahjongNet.MQTT_URL,{clientId:this.myId,clean:true,connectTimeout:10000,reconnectPeriod:0});this.client.on('connect',()=>{this._ok=true;while(this._buf.length){const t=this._buf.shift();this.client.publish(this.topic,JSON.stringify(t),{qos:1})}rs()});this.client.on('message',(tp,pld)=>{try{const m=JSON.parse(pld.toString());if(m.from===this.myId)return;this._h(m)}catch(e){}});this.client.on('error',(e)=>{if(!this._ok)rj(e)});this.client.on('close',()=>{if(this._ok)this.onMsg('disconnected',{});this._ok=false});setTimeout(()=>{if(!this._ok){try{this.client.end(true)}catch(e){}rj(new Error('连接超时(15s)，请检查网络或稍后重试'))}},15000)})}
_s(){return new Promise(rs=>this.client.subscribe(this.topic,{qos:1},()=>rs()))}
_u(){return new Promise(rs=>{if(!this.client)return rs();this.client.unsubscribe(this.topic,()=>rs())})}
_p(m){if(!this._seq)this._seq=0;m.seq=++this._seq;const p=JSON.stringify(m);if(!this._ok||!this.client){this._buf.push(m);return}this.client.publish(this.topic,p,{qos:1})}
_h(m){switch(m.type){case'state':this.onMsg('state',m.data);break;case'action':this.onMsg('action',{fromPeerId:m.from,action:m.data});break;case'join':this.onMsg('peer-join',{peerId:m.from,name:m.name,isHost:m.isHost});break;case'leave':this.onMsg('peer-leave',{peerId:m.from});break;case'start-game':this.onMsg('start-game',{players:m.players,mySeat:m.mySeat});break}}
destroy(){try{this.client&&this.client.end(true)}catch(e){}this.client=null;this._ok=false}
}

/* ===== ui.js ===== */
let game=null,net=null,mode='single',mySeat=0,selIdx=-1,curCode=null;
function setMode(m){mode=m;document.getElementById('btn-single').classList.toggle('active',m==='single');document.getElementById('btn-online').classList.toggle('active',m==='online');document.getElementById('lobby-single').style.display=m==='single'?'block':'none';document.getElementById('lobby-online').style.display=m==='online'?'block':'none'}
const SC={w:'万',b:'饼',t:'条'};
const FC=['东','南','西','北'];const JC=['中','发','白'];
function td(t){if(SUITS.includes(t.suit))return{text:t.value+SC[t.suit],cls:[t.suit]};if(t.suit==='f')return{text:FC[t.value-1],cls:['feng']};return{text:JC[t.value-1],cls:['jian']}}
function renderTile(t,w=false,f=true){const el=document.createElement('span');el.className='tile';if(f){const d=td(t);el.classList.add('tile-face',...d.cls,d.cls[0]+'-zi');if(w)el.classList.add('wan-tile');el.textContent=d.text}else el.classList.add('tile-back');return el}
function enterTable(){document.getElementById('lobby').style.display='none';document.getElementById('table').style.display='block'}
function renderAll(){if(!game)return;for(let i=0;i<4;i++)renderSeat(i);renderCenter();renderActions()}
function renderSeat(seat){const el=document.getElementById('seat-'+seat);const p=game.players[seat];const isMe=mode==='single'||seat===mySeat;const isBanker=game.bankerSeat===seat;const nameEl=el.querySelector('.name');nameEl.textContent=SEATS[seat]+(isBanker?' · 庄':'');nameEl.classList.toggle('host',isBanker);const hb=el.querySelector('.hand-back');const hm=el.querySelector('.hand-me');hb.innerHTML='';hm.innerHTML='';if(isMe){const h=p.hand||[];h.forEach((t,idx)=>{const w=game.wanTile&&tileKey(t)===tileKey(game.wanTile);const te=renderTile(t,w,true);if(game.phase==='discard'&&game.currentSeat===seat&&!p.isGongzhu){te.onclick=()=>selectTile(idx);te.style.cursor='pointer'}if(idx===selIdx)te.style.boxShadow='0 0 0 2px #e9c46a';hm.appendChild(te)});hm.style.display='flex';hb.style.display='none'}else{const pc=p.handCount!==undefined?p.handCount:(p.hand?p.hand.length:0);for(let k=0;k<pc;k++)hb.appendChild(renderTile(null,false,false));hm.style.display='none';hb.style.display='flex'}const mEl=el.querySelector('.meld-row');mEl.innerHTML='';(p.melds||[]).forEach(m=>{const g=document.createElement('div');g.className='meld-group';m.tiles.forEach(t=>{const showBack=m.isAnGang&&(m.tiles.indexOf(t)===0||m.tiles.indexOf(t)===3);g.appendChild(renderTile(t,false,!showBack))});mEl.appendChild(g)})}
function renderCenter(){const info=document.getElementById('center-info');const g=game;let pt='';switch(g.phase){case'waiting':pt='等待开始';break;case'dealing':pt='发牌中...';break;case'draw':pt=SEATS[g.currentSeat]+'家摸牌';break;case'discard':pt=SEATS[g.currentSeat]+'家出牌';break;case'action':pt='碰杠判定中...';break;case'gameover':pt='本局结束';break}let wh='';if(g.wanTile){const d=td(g.wanTile);wh='混儿：'+d.text+'（1张） | 杠数：'+g.gangCount}info.innerHTML='<div class="phase">'+pt+'</div>'+(wh?'<div class="wan-info">'+wh+'</div>':'')}
function selectTile(idx){const p=game.players[game.currentSeat];if(p.isGongzhu)return;const me=mode==='single'||net.isHost;if(!me){net.broadcast({type:'action',action:{type:'discard',seat:game.currentSeat,tileIndex:idx}});return}game.discard(game.currentSeat,idx);selIdx=-1;renderAll();afterDiscard()}
function afterDiscard(){const ds=game.lastDiscard.fromSeat;const act=game.resolveActionPriority(ds);if(act){setTimeout(()=>{if(act.action==='pong'){logMsg(SEATS[act.seat]+'家碰！');game.executePong(act.seat)}else{logMsg(SEATS[act.seat]+'家明杠！');game.executeMingGang(act.seat)}renderAll();afterPongGang();broadcastFull()},400)}else{setTimeout(()=>nextSeatDraw(),300)}}
function afterPongGang(){renderAll()}
function nextSeatDraw(){if(!game.canDraw()){const r=game.settleLiuJu();logMsg('🚫 流局！');showResult(r);broadcastFull();return}const ns=game.currentSeat;const r=game.drawTile(ns);renderAll();if(r&&r.hu){handleZiMoHu(ns,r.hu);broadcastFull()}else{renderAll();broadcastFull()}}
function handleZiMoHu(s,hi){logMsg('🎉 '+SEATS[s]+'家自摸胡！');const r=game.settle(s,hi);showResult(r)}
function showResult(r){renderAll();const o=document.getElementById('result-overlay');const t=document.getElementById('result-title');const tot=document.getElementById('result-total');const d=document.getElementById('result-detail');if(r.liuju){t.textContent='🚫 流局';tot.textContent='无人得分';d.textContent=''}else{t.textContent='🎉 自摸胡！';tot.textContent=r.totalMultiplier+' 倍';const fl=r.fenpai.fans.map(f=>f.name+'('+f.m+')').join(' × ');d.innerHTML='番型：'+fl+'<br>赢家：'+SEATS[r.winnerSeat]+'<br>'+r.payments.map(p=>SEATS[p.from]+' → '+SEATS[p.to]+'：'+p.amount+'分').join('<br>')}o.style.display='flex'}
function closeResult(){document.getElementById('result-overlay').style.display='none';if(game.phase==='gameover'){if(mode==='single')startGame();else{logMsg('等待主机下一局...');game.phase='waiting';renderAll();broadcastFull()}}}
function logMsg(m){const l=document.getElementById('msg-log');const d=document.createElement('div');d.textContent=m;l.appendChild(d);l.scrollTop=l.scrollHeight}
function renderActions(){const b=document.getElementById('action-bar');b.innerHTML='';b.style.display='none';if(!game)return}
// ============ 单机模式 ============
function startGame(){mode='single';mySeat=0;enterTable();hostStartGame()}
function hostStartGame(){game=new QHDMahjongGame();const ws=Math.floor(Math.random()*34);const deck=shuffle(buildFullDeck());const wi=Math.floor(Math.random()*deck.length);const wt={suit:deck[wi].suit,value:deck[wi].value};const nw=nextTile(wt);const aw=findTile(deck,nw.suit,nw.value);game.newRound();game.dealTiles(ws,aw);logMsg('🎮 游戏开始');const dk=game.findStartDarkGang();for(const it of dk){logMsg(SEATS[it.seat]+'家起手风牌暗杠');game.executeStartDarkGang(it.seat,it.fengKeys[0])}renderAll();if(mode==='single'){setTimeout(()=>{nextSeatDraw()},600)}}
// ============ 联机模式（主机仲裁） ============
let hostPeers=[]; // [{peerId,seat,name,joined}] 主机维护
async function createRoom(){const lb=document.getElementById('lobby-status');lb.textContent='连接 MQTT 服务器...';net=new MahjongNet((t,d)=>netMsg(t,d));try{const code=MahjongNet.genRoomCode();await net.createRoom(code);curCode=code;hostPeers=[{peerId:net.myId,seat:0,name:'你(主机)',joined:true}];document.getElementById('create-info').innerHTML='房间号：<b>'+code+'</b><br>已加入：1/4';lb.textContent='✅ 房间已创建，把房间号发给朋友！';document.getElementById('start-bar').style.display='flex'}catch(e){lb.textContent='❌ 连接失败：'+e.message}}
async function joinRoom(){const code=document.getElementById('join-code').value.trim();if(!code){document.getElementById('lobby-status').textContent='请输入6位房间号';return}const lb=document.getElementById('lobby-status');lb.textContent='连接服务器...';net=new MahjongNet((t,d)=>netMsg(t,d));try{await net.joinRoom(code,'玩家');curCode=code;lb.textContent='✅ 已连接，等待主机开始...'}catch(e){lb.textContent='❌ 连接失败：'+e.message}}
function netMsg(t,d){console.log('[NET]',t,d);const lb=document.getElementById('lobby-status');switch(t){case'peer-join':if(!net.isHost)break;if(!hostPeers.find(p=>p.peerId===d.peerId)){const nextSeat=hostPeers.length;if(nextSeat<4){hostPeers.push({peerId:d.peerId,seat:nextSeat,name:d.name||('玩家'+(nextSeat+1)),joined:true});logMsg('👥 '+d.name+' 加入（座位'+(nextSeat+1)+'）');lb.textContent='✅ 已加入 '+hostPeers.length+'/4 人'}}break;case'peer-leave':if(!net.isHost)break;const i=hostPeers.findIndex(p=>p.peerId===d.peerId);if(i>=0){logMsg('👋 '+hostPeers[i].name+' 离开');hostPeers.splice(i,1);lb.textContent='✅ 已加入 '+hostPeers.length+'/4 人'}break;case'start-game':enterTable();mySeat=d.mySeat;game=new QHDMahjongGame();game.phase='waiting';// 客户端等主机推完整 statefor(let i=0;i<4;i++){if(d.players[i])game.players[i].name=d.players[i].name}logMsg('🎮 主机开始游戏...');break;case'state':applyRemoteState(d);break;case'disconnected':logMsg('❌ 连接断开');break;case'action':handlePeerAction(d);break}}
function applyRemoteState(s){// 客户端/主机收到完整 state，重建 game 对象
if(!game)game=new QHDMahjongGame();Object.assign(game,s.state);game.players=s.state.players;// 客户端只看别人背面，自己的手牌用 sendMyHand 还原
renderAll();}
function handlePeerAction(d){// 主机处理客户端发来的操作
if(!game||game.phase==='gameover')return;switch(d.action.type){case'discard':game.discard(d.action.seat,d.action.tileIndex);selIdx=-1;renderAll();afterDiscard();break}}
function serializeForClient(forPeerId){// 主机广播 state 给指定客户端，只脱敏给该客户端自己看真实手牌
const peerSeat=hostPeers.find(p=>p.peerId===forPeerId)?.seat;
const players=game.players.map((p,i)=>{const sendReal=(i===peerSeat);return{seat:p.seat,name:p.name,hand:sendReal?p.hand:[],handCount:p.hand.length,melds:p.melds,isGongzhu:p.isGongzhu}});
return{state:{players,deck:game.deck,drawCursor:game.drawCursor,wanTile:game.wanTile,wanKey:game.wanKey,bankerSeat:game.bankerSeat,currentSeat:game.currentSeat,phase:game.phase,lastDiscard:game.lastDiscard,gangCount:game.gangCount,handStartSeat:game.handStartSeat,isFirstDraw:game.isFirstDraw,gangAfterDraw:game.gangAfterDraw}};}
function broadcastFull(){// 主机广播完整 state 给所有人
if(!net||!net.isHost)return;hostPeers.forEach(p=>{net.broadcast({type:'state',from:net.myId,data:serializeForClient(p.peerId)})});}
function onlineHostStart(){// 联机主机点"开始游戏"
if(!net||!net.isHost)return;if(hostPeers.length<2){document.getElementById('lobby-status').textContent='至少需要2人才能开始（你+朋友）';return}hostStartGame();// 单机和联机共用发牌逻辑
// 广播 start-game 给所有客户端，让他们进入牌桌
hostPeers.forEach(p=>{net.broadcast({type:'start-game',from:net.myId,players:hostPeers.map(h=>({seat:h.seat,name:h.name})),mySeat:p.seat})});// 主机自己也进入牌桌
enterTable();mySeat=0;setTimeout(()=>broadcastFull(),500);setTimeout(()=>{nextSeatDraw();broadcastFull()},1500)}
setMode('single');
</script>
